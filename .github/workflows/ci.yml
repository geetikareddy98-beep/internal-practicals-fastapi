name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q --cov=app --cov-branch --cov-report=term-missing --cov-report=xml:evidence/ci/coverage.xml --junitxml=evidence/ci/pytest.xml
      - name: Export OpenAPI
        run: python -c "import json; from app.main import app; open('evidence/ci/openapi.json', 'w').write(json.dumps(app.openapi(), indent=2))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: evidence/ci/
  container:
    name: container-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sample-api:test .
      - name: Smoke test container
        shell: bash
        run: |
          docker run -d --name exam-api -p 127.0.0.1:8000:8000 sample-api:test
          trap 'docker logs exam-api; docker rm -f exam-api' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > health.json; then
              python -c 'import json; assert json.load(open("health.json")) == {"status": "ok"}'
              exit 0
            fi
            sleep 1
          done
          exit 1
  publish:
    name: publish-ghcr
    needs: [lint, tests, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GHCR_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
